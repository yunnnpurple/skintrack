
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkinTrack 個人保養管理與追蹤網站">
  <title>SkinTrack | 我的保養日常</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo">✿ SkinTrack</a>
      <p class="tagline">讓每一天的保養更簡單</p>
    </div>
  </header>

  <nav class="main-nav" aria-label="主要導覽">
    <button class="nav-button active" data-page="dashboard">今日保養</button>
    <button class="nav-button" data-page="products">我的保養品</button>
    <button class="nav-button" data-page="tracker">保養紀錄</button>
  </nav>

  <main class="container">

    <!-- Dashboard -->
    <section id="dashboard" class="page active">
      <div class="page-heading">
        <p class="eyebrow">MY DAILY ROUTINE</p>
        <h1>今天也要好好保養 ♡</h1>
        <p id="today-date"></p>
      </div>

      <div class="card">
        <h2>今日完成進度</h2>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text">尚未開始今日保養</p>
      </div>

      <div class="routine-grid">
        <div class="card">
          <h2>☀️ 早上保養</h2>
          <div id="morning-routine" class="routine-list"></div>
        </div>

        <div class="card">
          <h2>🌙 晚上保養</h2>
          <div id="evening-routine" class="routine-list"></div>
        </div>
      </div>
    </section>

    <!-- My Products -->
    <section id="products" class="page">
      <div class="page-heading">
        <p class="eyebrow">MY SKINCARE COLLECTION</p>
        <h1>我的保養品</h1>
        <p>整理你正在使用的每一瓶保養品。</p>
      </div>

      <div class="card">
        <h2>新增保養品</h2>
        <form id="product-form">
          <input type="hidden" id="product-id">

          <label for="product-brand">品牌</label>
          <input id="product-brand" type="text"
                 placeholder="例如：CeraVe" required>

          <label for="product-name">產品名稱</label>
          <input id="product-name" type="text"
                 placeholder="例如：保濕乳液" required>

          <label for="product-category">產品類型</label>
          <select id="product-category">
            <option value="cleanser">清潔</option>
            <option value="toner">化妝水</option>
            <option value="serum">精華液</option>
            <option value="moisturizer">乳液／乳霜</option>
            <option value="sunscreen">防曬</option>
            <option value="other">其他</option>
          </select>

          <fieldset>
            <legend>使用時間</legend>
            <label class="checkbox-label">
              <input type="checkbox" id="routine-morning" checked>
              早上
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="routine-evening" checked>
              晚上
            </label>
          </fieldset>

          <button type="submit" class="primary-button" id="save-product">
            儲存保養品
          </button>
          <button type="button" class="secondary-button" id="cancel-edit" hidden>
            取消編輯
          </button>
        </form>
      </div>

      <div class="card">
        <h2>我的產品清單</h2>
        <div id="product-list"></div>
      </div>
    </section>

    <!-- Tracker -->
    <section id="tracker" class="page">
      <div class="page-heading">
        <p class="eyebrow">SKINCARE JOURNAL</p>
        <h1>保養紀錄</h1>
        <p>每一次的小小堅持，都值得被記錄。</p>
      </div>

      <div class="card">
        <h2>本週保養進度</h2>
        <p id="weekly-summary"></p>
        <div id="weekly-chart" class="weekly-chart"></div>
      </div>

      <div class="card">
        <h2>歷史紀錄</h2>
        <div id="history-list"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© SkinTrack · Your skincare, your rhythm.</p>
    <p>資料儲存在目前使用的瀏覽器中。</p>
  </footer>
</body>
</html>
